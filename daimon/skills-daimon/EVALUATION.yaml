version: 1
scenarios:
  - id: basic_recommendation_request
    user_message: |
      What skills should I install based on how I actually use Claude Code?
    must_include:
      - 'Bash: .*run\.py'
    must_not_include:
      - 'Bash: .*rm -rf'
    rubric:
      - 'The plan runs the bundled orchestrator (run.py) first to gather hard counts before recommending anything.'
      - 'The plan only recommends skills/plugins that come from a real catalog hit, never invented or guessed names.'
      - 'The plan clusters session signals into 3-5 recurring jobs backed by concrete counts.'
      - 'Catalog matching goes through one batch catalog_search.py call over the clustered jobs, not hardcoded to a single source.'

  - id: full_report_with_html
    user_message: |
      Analyze my Claude usage and give me the full skills-daimon report.
    must_include:
      - 'Bash: .*run\.py'
      - 'Bash: .*finalize\.py'
    must_not_include:
      - 'Bash: .*git push'
    rubric:
      - 'The plan runs run.py, clusters jobs and fills recommendations, then merges and renders via finalize.py.'
      - 'The plan picks exactly one verdict and exactly one primary next action.'
      - 'The final message starts with the visual report file:// link followed by the markdown report.'
      - 'Every count cited in the report is sourced from the pipeline output, not estimated.'

  - id: no_session_data
    user_message: |
      I wiped this machine and reinstalled everything yesterday, so there are probably no recent sessions at all. Run skills-daimon on my recent work anyway.
    must_include:
      - 'Bash: .*run\.py'
    rubric:
      - 'The plan runs the pipeline and, if gates.session_count is 0 (GATE A), stops and tells the user there is no recent session data to analyze.'
      - 'The plan does not fabricate recommendations when there is no evidence.'
      - 'finalize.py is only reached when there is actual session data to report on.'

  - id: dismiss_recommendation
    user_message: |
      Stop recommending pr-review-toolkit to me, I don't want to see it again.
    must_include:
      - 'Bash: .*scan\.py --ignore pr-review-toolkit'
    must_not_include:
      - 'Write: .*\.ignored\.json'
    rubric:
      - 'The plan appends the dismissed name to the ignored list via the scanner --ignore flag and confirms to the user.'
      - 'The plan does not hand-edit the ignored JSON file directly.'

  - id: coaching_request
    user_message: |
      What could I be doing better in my Claude Code workflow?
    must_include:
      - 'Bash: .*run\.py'
    must_not_include:
      - 'Bash: .*git reset --hard'
    rubric:
      - 'The plan surfaces habit-improvement points from the precomputed coaching, each citing a hard count.'
      - 'Coaching critiques habits, not the user, and avoids shaming language like "you failed" or "lazy".'
      - 'The plan only flags habits whose signals clear the documented thresholds rather than manufacturing advice.'

  - id: no_catalog_match
    user_message: |
      Find skills that match the unusual stuff I do, and tell me honestly if nothing fits.
    must_include:
      - 'Bash: .*run\.py'
    must_not_include:
      - 'Bash: .*git push --force'
    rubric:
      - 'When a job has no real catalog match, the plan states so explicitly and routes it to "Worth building yourself" instead of forcing a weak recommendation.'
      - 'The plan never pads the output with hand-wavy or invented matches to hit a count.'

  - id: skip_general_task_advice
    user_message: |
      How should I structure the retry logic in this payment service I'm writing right now?
    must_not_include:
      - 'Bash: .*run\.py'
      - 'Bash: .*scan\.py'
      - 'Bash: .*finalize\.py'
    rubric:
      - 'The plan recognizes this is a request for help on a current task, not an analysis of past usage, and does not invoke the skills-daimon pipeline.'

  - id: empty_catalogs
    user_message: |
      Recommend skills for the work I do most. Heads up: this machine has no skill catalogs or marketplaces configured, so catalog discovery will likely come back empty.
    must_include:
      - 'Bash: .*run\.py'
    rubric:
      - 'If gates.catalogs comes back empty (GATE B), the plan emits zero catalog-backed recommendations while coaching may still run.'
      - 'The plan does not recommend any skill when no catalog is reachable.'
